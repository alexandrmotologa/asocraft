name: ASO Store Metadata Quality & Constraint Check

on:
  pull_request:
    paths:
      - 'fastlane/metadata/**'
      - 'metadata.*.json'
      - 'aso.config.json'
  push:
    branches:
      - main

jobs:
  aso-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Build
        run: npm run build
