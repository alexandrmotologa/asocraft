name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Test CLI Executable
        run: |
          node ./bin/asocraft.js --version
          node ./bin/asocraft.js -v
          node ./bin/asocraft.js -V
          node ./bin/asocraft.js version
          node ./bin/asocraft.js --help
